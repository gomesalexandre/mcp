name: Deploy MCP Server (Dev)

on:
  push:
    branches: [feat/deploy-rsync]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/mcp-server/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER: ${{ secrets.DEV_SERVER_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: /home/${{ secrets.DEPLOY_USER }}/mcp
        run: |
          export RSYNC_RSH="ssh -i ~/.ssh/deploy_key"
          bash scripts/deploy.sh
