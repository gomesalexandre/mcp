version: "2"

linters:
  enable:
    # Bug detection
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - sqlclosecheck
    - durationcheck

    # Security
    - gosec

    # Code quality
    - unused
    - gocritic
    - errorlint
    - copyloopvar
    - revive          # doc comments on exported symbols + code quality

  # nilerr intentionally excluded: MCP SDK tool handlers return
  # (mcp.ToolResultError, nil) — the nil Go error is correct by design.

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment  # struct padding — noisy, not a bug
        - shadow          # variable shadowing — too many false positives with err
    gosec:
      excludes:
        - G104  # unhandled errors (errcheck covers this)
        - G115  # integer overflow on conversion — too noisy, mostly safe casts
        - G101  # "hardcoded credentials" — false positives on smart contract addresses
        - G602  # slice bounds — false positives on range-guarded access
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - hugeParam            # performance suggestion, not a bug
        - rangeValCopy         # performance suggestion, not a bug
        - sprintfQuotedString  # pedantic in JSON template strings
    revive:
      rules:
        - name: exported
          severity: warning
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write  # standard pattern in HTTP handlers
        - (io.Closer).Close                # defer Close() is standard Go

  exclusions:
    rules:
      # defer resp.Body.Close() is standard Go
      - linters: [errcheck]
        source: "defer.*\\.Close\\(\\)"
      # test files: unchecked json.Encode/Write/Unmarshal in test helpers is fine
      - linters: [errcheck]
        path: "_test\\.go"
      # errorlint: %v in error formatting is fine for errors that shouldn't be unwrapped
      - linters: [errorlint]
        source: "fmt\\.Errorf"

    paths:
      - deploy
      - third_party

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
